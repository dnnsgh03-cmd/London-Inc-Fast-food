<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b1f4d">
    <meta name="description" content="Sistema de pedidos y control de London Inc Fast Food">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>London Inc Fast Food</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/logo.jpg') }}">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
    <script src="{{ url_for('static', filename='script.js', v='inventory-balance-1') }}" defer></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/service-worker.js")
                    .catch(error => console.error("No se pudo registrar la PWA.", error));
            });
        }
    </script>
</head>

<body>
   <header>
    <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Logo London Inc" class="logo-img">

    <div style="flex:1">
        <h1>London Inc <span>Fast Food</span></h1>
        <div class="sub">Salchipapas y más · Sistema de pedidos y control</div>
    </div>

    <div class="header-actions">
        <button class="btn green sm noprint" onclick="manualSaveAll()" title="Guardar todo en Excel ahora">Guardar todo</button>
        <form method="post" action="{{ url_for('logout') }}" class="noprint">
            <button class="btn line sm logout-button" type="submit">Cerrar sesión</button>
        </form>
    </div>
</header>

    <div class="flag"></div>
    <nav id="nav" aria-label="Navegación principal"></nav>
    <div class="sync-bar">
        <div id="sync-status" class="sync-status" role="status" aria-live="polite">Conectando con Excel...</div>
        <button id="btn-quick-sync" class="btn line sm noprint" onclick="manualSaveAll()" title="Guardar todos los datos en Excel">Guardar todo en Excel ahora</button>
    </div>
    <main id="m"></main>
    <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
