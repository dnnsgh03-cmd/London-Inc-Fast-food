<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b1f4d">
    <title>Acceso · London Inc Fast Food</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <main class="login-card">
        <img src="{{ url_for('static', filename='img/pwa-icon.svg') }}" alt="" class="login-logo">
        <h1>London Inc <span>Fast Food</span></h1>
        <p class="mut">Inicia sesión para administrar el sistema.</p>
        {% if error %}
        <p class="login-error" role="alert">{{ error }}</p>
        {% endif %}
        {% if not unavailable %}
        <form method="post" action="{{ url_for('login') }}">
            <label for="password">Contraseña de acceso</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
            <button class="btn red" type="submit">Iniciar sesión</button>
        </form>
        {% endif %}
    </main>
</body>
</html>
